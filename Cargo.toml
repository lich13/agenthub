[workspace]
members = [
  "crates/agenthub-core",
  "crates/agenthub-webd",
]
resolver = "2"

[workspace.package]
version = "2.1.14"
edition = "2021"
license = "MIT"
repository = "https://github.com/lich13/agenthub"
rust-version = "1.99"

[workspace.dependencies]
libc = "0.2"
anyhow = "1.0"
aes-gcm = "0.10"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5.0"
hex = "0.4"
rand = "0.8"
# Keep the existing ring provider when sharing reqwest with the desktop updater.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider", "gzip"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process", "sync", "io-util", "io-std", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"
