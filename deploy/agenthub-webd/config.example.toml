[server]
# 管理 API 只允许回环地址；远程访问通过已有的 HTTPS 反向代理。
listen = "127.0.0.1:15742"

[codex]
workspace = "/home/ubuntu/codex-workspace"
host_label = "AgentHub"
# Codex 本地状态库: state_5.sqlite, session_index.jsonl, rollout files, and logs_2.sqlite.
# AgentHub reads native state and uses fixed native protocols for management.
# codex.home is omitted so AgentHub auto-discovers /root/.codex or /home/ubuntu/.codex.

[probe]
enabled = true
poll_seconds = 15
recent_limit = 50

[probe.hooks]
manage_stop_hook = true

[probe.notifications]
enabled = false
server_url = "https://api.day.app"
group = "AgentHub"
notify_completion = true
notify_reply_needed = true
notify_recoverable = true
notify_codex = true
notify_grok = true
notify_grok_completion = true
notify_grok_failure = true
notify_claude = true
notify_claude_completion = true
notify_claude_failure = true
notify_claude_reply_needed = true

[probe.observability]
event_retention_days = 2
hook_event_max_lines = 500
hook_cooldown_max_lines = 1000
log_max_bytes = 5242880

[security]
auth_rate_limit_per_minute = 8

[paths]
data_dir = "/var/lib/agenthub-webd"
db_path = "/var/lib/agenthub-webd/agenthub.sqlite"
log_dir = "/var/log/agenthub-webd"

[update]
precheck_command = "/usr/local/bin/agenthub-codex-precheck"
update_command = "/usr/local/bin/agenthub-codex-update"
prune_command = "/usr/local/bin/agenthub-codex-prune"
doctor_command = "/usr/local/bin/agenthub-codex-precheck"
panel_update_command = "/usr/local/bin/agenthub-webd-update --repo lich13/agenthub --version latest"
panel_precheck_command = "test -x /usr/local/bin/agenthub-webd-update && systemctl is-active agenthub-webd && curl -fsS http://127.0.0.1:15742/healthz"
