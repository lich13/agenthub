name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Release boundary guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify version, contract, privacy and release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          [[ "${tag}" == "v${version}" ]] || { echo "tag ${tag} does not match ${version}" >&2; exit 1; }
          python3 scripts/check-versions.py --tag "${tag}"
          python3 scripts/privacy-check.py --git-objects
          node scripts/contract-next-action-checklist.mjs grok.rename >/dev/null
          git diff --check
          python3 scripts/release-notes.py "${version}" > "${RUNNER_TEMP}/release-notes-check.md"
          python3 scripts/release-notes.py "${version}" --updater >/dev/null
          for section in "版本概览" "功能调整" "问题修复" "兼容性与迁移" "支持平台与资产" "升级提示"; do
            grep -q "^## ${section}$" "${RUNNER_TEMP}/release-notes-check.md"
          done

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  webd-linux:
    name: Linux webd asset
    runs-on: ubuntu-24.04
    needs: guard
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned action; explicit toolchain below
        with:
          toolchain: 1.99.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-release-webd-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-release-webd-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.21.0-pnpm-12.11.2-${{ hashFiles('webui/pnpm-lock.yaml') }}
      - run: pnpm --dir webui install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bash scripts/package-webd-linux-x86_64.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenthub-webd-linux-x86_64
          path: |
            dist/agenthub-webd-linux-x86_64.tar.gz
            dist/agenthub-webd-linux-x86_64.tar.gz.sha256
            dist/agenthub-webd-linux-x86_64.tar.gz.sig

  macos:
    name: macOS arm64 assets
    runs-on: macos-15
    needs: guard
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # pinned action; explicit toolchain below
        with:
          toolchain: 1.99.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.21.0-pnpm-12.11.2-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-24.21.0-pnpm-12.11.2-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-release-macos-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-release-macos-
      - run: pnpm --dir webui install --frozen-lockfile
      - run: bash scripts/package-darwin-arm64.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agenthub-darwin-arm64
          path: |
            dist/agenthub-darwin-arm64.tar.gz
            dist/agenthub-darwin-arm64.tar.gz.sig
            dist/AgentHub-*-darwin-arm64.dmg
            dist/AgentHub-*-darwin-arm64.dmg.sha256

  release:
    name: Publish eight assets
    runs-on: ubuntu-24.04
    needs: [guard, ci, webd-linux, macos]
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agenthub-*
          path: dist
          merge-multiple: true
      - name: Generate darwin updater manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          python3 scripts/release-notes.py "${version}" > "${RUNNER_TEMP}/release-notes.md"
          python3 - "${version}" "${tag}" "$(cat dist/agenthub-darwin-arm64.tar.gz.sig)" <<'PY'
          import json, os, pathlib, subprocess, sys
          version, tag, signature = sys.argv[1:]
          notes = subprocess.check_output([sys.executable, "scripts/release-notes.py", version, "--updater"], text=True).strip()
          data = {
              "version": version,
              "notes": notes,
              "pub_date": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": {"darwin-aarch64": {
                  "signature": signature,
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/agenthub-darwin-arm64.tar.gz"
              }}
          }
          pathlib.Path("dist/latest.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Verify release asset boundary
        shell: bash
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "${count}" == "8" ]] || { echo "expected eight release assets, found ${count}" >&2; find dist -maxdepth 1 -type f -print; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/AgentHub-*-darwin-arm64.dmg
            dist/AgentHub-*-darwin-arm64.dmg.sha256
            dist/agenthub-darwin-arm64.tar.gz
            dist/agenthub-darwin-arm64.tar.gz.sig
            dist/latest.json
            dist/agenthub-webd-linux-x86_64.tar.gz
            dist/agenthub-webd-linux-x86_64.tar.gz.sha256
            dist/agenthub-webd-linux-x86_64.tar.gz.sig
