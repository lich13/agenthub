version: 2
updates:
  - package-ecosystem: cargo
    directories: ['/', '/src-tauri']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tauri*'
        update-types: ['version-update:semver-minor']
    groups:
      rust-compatible:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      rust-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      frontend-compatible:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: all
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions-compatible:
        applies-to: version-updates
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
